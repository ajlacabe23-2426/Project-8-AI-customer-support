name: Agent Team v2 contract

on:
  push:
    branches: [main, 'feat/**', 'chore/**', 'security/**']
  pull_request:

permissions:
  contents: read

jobs:
  agent-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate active task contract and scope
        run: python3 .github/scripts/validate_task_contract.py
      - name: Run offline Agent Team v2 regression tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_agent_team_v2.py' -v
