name: Agent Team v2 contract

on:
  push:
    branches: [main, 'feat/**', 'chore/**']
  pull_request:

permissions:
  contents: read

jobs:
  agent-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate active task contract and scope
        run: python3 .github/scripts/validate_task_contract.py
      - name: Run offline Agent Team v2 regression tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_agent_team_v2.py' -v
