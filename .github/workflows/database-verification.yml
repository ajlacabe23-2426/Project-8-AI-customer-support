name: Disposable Project 8 database and widget verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development dependencies and pinned local CLI
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund supabase@2.109.1
      - name: Start and reset disposable stack
        id: local
        run: |
          ./node_modules/.bin/supabase start >/dev/null
          ./node_modules/.bin/supabase db reset --local >/dev/null
      - name: Test local owner isolation, widget, and CORS
        if: steps.local.outcome == 'success'
        run: |
          node <<'JS'
          const {spawnSync}=require('node:child_process');
          const status=spawnSync('./node_modules/.bin/supabase',['status','-o','json'],{encoding:'utf8'});
          if(status.status!==0)throw Error('Disposable Supabase status failed');
          const values=JSON.parse(status.stdout);
          if(values.API_URL!=='http://127.0.0.1:54321')throw Error('Not a loopback Supabase endpoint');
          for(const key of ['ANON_KEY','SERVICE_ROLE_KEY']){
            if(typeof values[key]!=='string'||!values[key])throw Error('Missing disposable credential: '+key);
            process.stdout.write('::add-mask::'+values[key]+'\n');
          }
          const env={...process.env,API_URL:values.API_URL,ANON_KEY:values.ANON_KEY,
            SERVICE_ROLE_KEY:values.SERVICE_ROLE_KEY,NEXT_PUBLIC_SUPABASE_URL:values.API_URL,
            NEXT_PUBLIC_SUPABASE_ANON_KEY:values.ANON_KEY,SUPABASE_SERVICE_ROLE_KEY:values.SERVICE_ROLE_KEY,
            NEXT_PUBLIC_APP_URL:'http://127.0.0.1:3118',OPENAI_API_KEY:''};
          const build=spawnSync('npm',['run','build'],{stdio:'inherit',env});
          if(build.status!==0)process.exit(build.status||1);
          const tests=spawnSync('node',['tests/integration/project8.integration.mjs'],{stdio:'inherit',env});
          process.exit(tests.status||0);
          JS
      - name: Stop disposable stack
        if: always()
        run: |
          if [ -x ./node_modules/.bin/supabase ]; then
            ./node_modules/.bin/supabase stop --no-backup >/dev/null
          fi
