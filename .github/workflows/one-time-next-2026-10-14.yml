name: One-time Next.js lockfile regeneration

on:
  push:
    branches:
      - "security/next-patch-2026-10-12"
    paths:
      - ".github/workflows/one-time-next-2026-10-14.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "security/next-patch-2026-10-12"
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Use stable npm 11
        run: npm install --global npm@11.6.0 --no-audit --no-fund

      - name: Regenerate package manifest and lockfile
        run: |
          npm pkg set "dependencies.next=15.5.28"
          npm pkg set "devDependencies.eslint-config-next=15.5.28"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); if(p.packages['node_modules/next']?.version!=='15.5.28') process.exit(1); if(p.packages['node_modules/eslint-config-next']?.version!=='15.5.28') process.exit(1)"

      - name: Commit npm-generated dependency update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were produced."
            exit 0
          fi
          git commit -m "fix(security): update Next.js to 15.5.28"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"security/next-patch-2026-10-12"
