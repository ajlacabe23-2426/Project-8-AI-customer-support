name: Verify Project 8
on:
  push:
    branches: [main, 'feat/**', 'security/**']
  pull_request:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test dependency audit launcher and policy
        run: node --test scripts/security/audit-dependencies.node-check.mjs
      - name: Verify local Next-specific ESLint guards are active
        run: node --test lint/next-core-guards.node-check.mjs
      - run: npm run security:secrets
      - run: npm run security:baseline
      - name: Require zero production dependency advisories
        run: npm audit --omit=dev --audit-level=low
      - name: Enforce high-severity dependency policy
        run: npm run security:dependencies
      - name: Report full dependency advisories
        continue-on-error: true
        run: npm audit --include=dev --audit-level=moderate
      - run: npm run check

  audit-launcher-windows:
    name: Windows audit CLI regression
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Test real shell-free npm CLI child process and fail-closed policy
        run: node --test scripts/security/audit-dependencies.node-check.mjs
