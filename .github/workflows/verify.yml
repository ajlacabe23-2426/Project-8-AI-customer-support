name: Verify Project 8
on:
  push:
    branches: [main, 'feat/**', 'security/**']
  pull_request:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run security:secrets
      - run: npm run security:baseline
      - name: Enforce high-severity dependency policy
        run: npm run security:dependencies
      - name: Report full dependency advisories
        continue-on-error: true
        run: npm audit --include=dev --audit-level=moderate
      - run: npm run check
