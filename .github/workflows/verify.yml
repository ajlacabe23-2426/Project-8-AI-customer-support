name: Verify Project 8
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Bootstrap only. Pin and commit a reviewed lockfile before release, then use npm ci.
      - run: npm ci --no-audit --no-fund
      - run: npm run check
