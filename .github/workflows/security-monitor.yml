name: Security monitor

on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main, 'feat/**', 'security/**']
  schedule:
    - cron: "37 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    name: Repository security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Scan reachable history for credential material
        run: npm run security:secrets
      - name: Validate repository security baseline
        run: npm run security:baseline
      - name: Enforce high-severity dependency policy
        run: npm run security:dependencies
      - name: Report full dependency advisories
        continue-on-error: true
        run: npm audit --include=dev --audit-level=moderate --package-lock-only
