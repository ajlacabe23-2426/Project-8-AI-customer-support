name: Project 8 security lockfile refresh
on:
  push:
    branches: [security/p8-vitest-advisory-20261019]
    paths:
      - package.json
      - .github/workflows/security-lockfile-refresh.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify dependency audit
        run: npm run security:dependencies
      - name: Commit regenerated lockfile on security branch only
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(security): regenerate Project 8 lint lockfile'
          git push origin HEAD:security/p8-vitest-advisory-20261019
